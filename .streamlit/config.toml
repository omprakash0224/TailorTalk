[server]
# Render injects $PORT at runtime; the CMD in the Dockerfile passes it via
# --server.port flag. This file sets additional production-safe defaults.
headless = true
enableCORS = false
enableXsrfProtection = false

# Disable the welcome "Do you want to receive product updates?" email prompt
# and the "Your app is starting up" splash screen.
[browser]
gatherUsageStats = false

[theme]
base = "dark"
